<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 背景颜色动画</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background-color: #f3f4f6;
            font-family: sans-serif;
        }

        .color-box {
            width: 220px;
            height: 220px;
            display: grid;
            place-items: center;
            border-radius: 28px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            animation:
                change-background 6s infinite alternate,
                bounce-dance 3s cubic-bezier(0.45, 0, 0.55, 1) infinite,
                glow-pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes change-background {
            0% {
                background-color: #ef4444;
            }
            25% {
                background-color: #f59e0b;
            }
            50% {
                background-color: #22c55e;
            }
            75% {
                background-color: #3b82f6;
            }
            100% {
                background-color: #a855f7;
            }
        }

        @keyframes bounce-dance {
            0%, 100% {
                transform: translateY(0) rotate(0) scale(1);
            }
            18% {
                transform: translateY(-85px) rotate(-12deg) scale(1.12, 0.9);
            }
            36% {
                transform: translateY(0) rotate(12deg) scale(0.92, 1.1);
            }
            54% {
                transform: translateY(-48px) rotate(-8deg) scale(1.06, 0.96);
            }
            72% {
                transform: translateY(0) rotate(8deg) scale(0.97, 1.04);
            }
            86% {
                transform: translateY(-20px) rotate(-3deg) scale(1.02);
            }
        }

        @keyframes glow-pulse {
            from {
                box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
            }
            to {
                box-shadow: 0 18px 48px rgba(79, 70, 229, 0.75);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .color-box {
                animation: none;
                background-color: #3b82f6;
            }
        }
    </style>
</head>
<body>
    <div class="color-box">背景颜色变化</div>
</body>
</html>
