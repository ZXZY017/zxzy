<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{}
        /* 所有选择器的名称 */
        .zitem{
          display: flex;
          padding: 10px 5px;
          margin-bottom: 5px;
          border-bottom: 1px dotted #ccc;
        }
        .zitem img{
          width:100px;
          height: 70px; /* 加高度限制，防止图片大小不一撑破布局 */
          object-fit: cover; /* 保证图片按比例裁剪不变形 */
        }
        .ytext{
          flex-grow: 1;
          margin-left:10px;
          display:flex; 
          flex-wrap: wrap;
          font-size: 12px;
          color:#aaa;
        }
        .ytext h3{
           width:100%;
           font-size: 16px;
           line-height: 40px;
           color:#333;
        }
        .author{
           flex-grow: 1;
           padding-left: 0px; /* 【修改1】这里改为0，让名字靠左对齐 */
        }
        .time{
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="zitem">
          <img src="./图片/1.png">
        <!-- 【修改2】这里从 yitem 改为 ytext，和上面的 CSS 对应 -->
        <div class="ytext">
            <h3>标题</h3>
            <span class="author">周徐倬玚</span>
            <span class="time">2026-9-21</span>
        </div>
        </div>
          <div class="zitem">
          <img src="./图片/2.png">
        <!-- 【修改2】这里从 yitem 改为 ytext -->
        <div class="ytext">
            <h3>标题</h3>
            <span class="author">周徐倬玚</span>
            <span class="time">2026-9-21</span>
        </div>
        </div>
          <div class="zitem">
          <img src="./图片/3.png">
        <!-- 【修改2】这里从 yitem 改为 ytext -->
        <div class="ytext">
            <h3>标题</h3>
            <span class="author">周徐倬玚</span>
            <span class="time">2026-9-21</span>
        </div>
        </div>
    </div>
</body>
</html>
