<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        :root {
            --bg1: #fbe7ff;
            --bg2: #dff6ff;
            --bg3: #e8fff3;
            --card: rgba(255, 255, 255, 0.72);
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #7c3aed;
            --accent-2: #06b6d4;
            --shadow: rgba(124, 58, 237, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(28px);
            opacity: 0.5;
            z-index: 0;
        }

        body::before {
            background: rgba(124, 58, 237, 0.24);
            top: -80px;
            right: -60px;
        }

        body::after {
            background: rgba(6, 182, 212, 0.22);
            bottom: -100px;
            left: -50px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(92vw, 540px);
            padding: 42px 36px 36px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px var(--shadow);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(6, 182, 212, 0.12));
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 1.2;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin: 16px auto 26px;
            max-width: 420px;
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .info {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(124, 58, 237, 0.08);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
            font-weight: 600;
            color: var(--text);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.7);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Welcome</div>
        <h1>1015 周徐倬玚</h1>
        <p class="subtitle">愿生活有光，代码有梦，未来始终值得期待。</p>
        <div class="info">
            <span class="dot"></span>
            <span>个人主页 · 设计中</span>
        </div>
    </div>
</body>
</html>
