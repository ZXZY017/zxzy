<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #e0f2fe, #f5f3ff);
            font-family: "Microsoft YaHei", sans-serif;
        }

        .slideshow {
            position: relative;
            width: min(720px, 100%);
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 20px;
            background: #111827;
            box-shadow: 0 20px 50px rgba(30, 41, 59, 0.25);
        }

        .slides-track {
            display: flex;
            width: 400%;
            height: 100%;
            animation: slide-position 16s infinite;
        }

        .slide {
            position: relative;
            flex: 0 0 25%;
            height: 100%;
            margin: 0;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide figcaption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 16px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            font-size: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        @keyframes slide-position {
            0%, 20% { transform: translateX(0); }
            25%, 45% { transform: translateX(-25%); }
            50%, 70% { transform: translateX(-50%); }
            75%, 95% { transform: translateX(-75%); }
            100% { transform: translateX(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .slides-track {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="slideshow" aria-label="自动播放的图片幻灯片">
        <div class="slides-track">
            <figure class="slide">
                <img src="./图片/a1.png" alt="幻灯片图片一">
                <figcaption>周徐倬玚</figcaption>
            </figure>
            <figure class="slide">
                <img src="./图片/a2.png" alt="幻灯片图片二">
                <figcaption>周徐倬玚</figcaption>
            </figure>
            <figure class="slide">
                <img src="./图片/a3.png" alt="幻灯片图片三">
                <figcaption>周徐倬玚</figcaption>
            </figure>
            <figure class="slide" aria-hidden="true">
                <img src="./图片/a1.png" alt="">
                <figcaption>周徐倬玚</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
