<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>13-4 · 移动端底部导航（SVG）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #e8e4dc;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .zhou-phone {
            position: relative;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            background: #f6f4f0;
        }

        .zhou-statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 6px;
            background: #fff;
            font-size: 12px;
            font-weight: 600;
        }

        .zhou-statusbar svg { width: 15px; height: 15px; margin-left: 5px; vertical-align: middle; }

        .zhou-appbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .zhou-appbar .zhou-title { font-size: 17px; font-weight: 600; }

        .zhou-appbar .zhou-bell { position: relative; color: #333; }
        .zhou-appbar .zhou-bell svg { width: 20px; height: 20px; display: block; }

        .zhou-badge {
            position: absolute;
            top: -5px;
            right: -7px;
            min-width: 15px;
            height: 15px;
            padding: 0 4px;
            border: 1.5px solid #fff;
            border-radius: 999px;
            background: #fa3534;
            color: #fff;
            font-size: 10px;
            font-style: normal;
            line-height: 12px;
            text-align: center;
        }

        .zhou-content { padding: 14px 14px 110px; }

        .zhou-search {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #fff;
            color: #999;
            font-size: 13px;
        }

        .zhou-search svg { width: 15px; height: 15px; }

        .zhou-banner { border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
        .zhou-banner img { display: block; width: 100%; }

        .zhou-section-title { margin: 18px 4px 10px; font-size: 15px; font-weight: 600; }

        .zhou-quick {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 14px 8px;
            border-radius: 12px;
            background: #fff;
        }

        .zhou-quick a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #333;
            text-decoration: none;
            font-size: 11px;
        }

        .zhou-quick .zhou-quick-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: #3498db;
        }

        .zhou-quick .zhou-quick-icon svg { width: 22px; height: 22px; }
        .zhou-quick a:nth-child(1) .zhou-quick-icon { background: #e8f4ff; color: #3498db; }
        .zhou-quick a:nth-child(2) .zhou-quick-icon { background: #fdeaea; color: #fa3534; }
        .zhou-quick a:nth-child(3) .zhou-quick-icon { background: #e9f9ee; color: #2ecc71; }
        .zhou-quick a:nth-child(4) .zhou-quick-icon { background: #fff6e5; color: #f5a623; }
        .zhou-quick a:nth-child(5) .zhou-quick-icon { background: #f3eaff; color: #9b59b6; }

        .zhou-item-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 10px;
        }

        .zhou-item-card img { width: 56px; height: 56px; border-radius: 12px; }

        .zhou-item-info { flex: 1; }
        .zhou-item-info h3 { font-size: 14px; }
        .zhou-item-info p { margin-top: 4px; color: #999; font-size: 11px; }

        .zhou-item-btn {
            align-self: center;
            padding: 6px 14px;
            border: none;
            border-radius: 999px;
            background: #fa3534;
            color: #fff;
            font-size: 12px;
        }

        .zhou-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            display: flex;
            width: 100%;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid #e8e8e8;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, .05);
            z-index: 100;
        }

        .zhou-tab {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 0;
            color: #999;
            text-decoration: none;
            font-size: 10px;
            transition: color .2s ease;
        }

        .zhou-tab .zhou-tab-icon { position: relative; line-height: 0; }

        .zhou-tab-icon svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .zhou-tab.zhou-active { color: #fa3534; }

        .zhou-tab .zhou-badge { top: -6px; right: -14px; border: none; }

        .zhou-tab .zhou-dot {
            position: absolute;
            top: -3px;
            right: -8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fa3534;
        }
    </style>
</head>

    <script>
        var zhouTabs = document.querySelectorAll('[data-zhou-tab]');
        zhouTabs.forEach(function (zhouTab) {
            zhouTab.addEventListener('click', function () {
                zhouTabs.forEach(function (t) { t.classList.remove('zhou-active'); });
                zhouTab.classList.add('zhou-active');
            });
        });
    </script>
