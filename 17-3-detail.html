<!DOCTYPE html>
<!-- 姓名：周徐倬玚，日期：2026-11-02，功能名称：商品详情页（按 ID 请求接口） -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 · 商品详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(160deg, #182140 0%, #1d2850 100%);
            color: #eef1fb;
            padding: 28px 16px 44px;
            min-height: 100vh;
        }
        .zxzy_wrap { max-width: 900px; margin: 0 auto; }

        /* ===== 顶部英雄卡片 ===== */
        .zxzy_hero {
            background: #212c50;
            border: 1px solid #323f6e;
            border-radius: 16px;
            padding: 24px 28px 28px;
        }
        .zxzy_hero_top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .zxzy_badge {
            background: #86b9f2;
            color: #14264d;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 999px;
        }
        .zxzy_links { display: flex; gap: 8px; }
        .zxzy_home {
            background: #2a3760;
            border: 1px solid #46558a;
            color: #dfe4f3;
            font-size: 13px;
            text-decoration: none;
            padding: 5px 16px;
            border-radius: 999px;
        }
        .zxzy_home:hover { background: #354478; }
        .zxzy_h1 { font-size: 30px; font-weight: bold; margin-bottom: 14px; }
        .zxzy_intro { font-size: 14px; line-height: 2.1; color: #aab4d4; }
        .zxzy_t {
            display: inline-block;
            padding: 0 8px;
            border-radius: 5px;
            font-family: Consolas, monospace;
            font-size: 13px;
            font-weight: bold;
        }
        .zxzy_t_url { background: rgba(125, 211, 252, .14); color: #7dd3fc; }
        .zxzy_t_fn  { background: rgba(74, 222, 128, .14); color: #4ade80; }
        .zxzy_b { color: #eef1fb; font-weight: bold; }

        /* ===== 区块标题 ===== */
        .zxzy_h2 { font-size: 18px; font-weight: bold; margin: 26px 2px 14px; }

        /* ===== 操作条 ===== */
        .zxzy_bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .zxzy_btn {
            background: #2a3760;
            border: 1px solid #46558a;
            border-radius: 10px;
            color: #eef1fb;
            font-family: inherit;
            font-size: 13px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background .12s ease, transform .12s ease;
        }
        .zxzy_btn:hover { background: #354478; transform: translateY(-2px); }
        .zxzy_btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .zxzy_status {
            margin-left: auto;
            font-size: 13px;
            color: #aab4d4;
            align-self: center;
            font-family: Consolas, monospace;
        }

        /* ===== 详情主体 ===== */
        .zxzy_main {
            background: #212c50;
            border: 1px solid #323f6e;
            border-radius: 16px;
            padding: 22px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            animation: zxzy_in .4s ease;
        }
        .zxzy_big {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            background: #1a2344;
            display: block;
        }
        .zxzy_thumbs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .zxzy_thumbs img {
            width: 62px;
            height: 62px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #2c3865;
            cursor: pointer;
            background: #1a2344;
        }
        .zxzy_thumbs img:hover { border-color: #7dd3fc; }

        .zxzy_title { font-size: 22px; font-weight: bold; line-height: 1.45; }
        .zxzy_brand { font-size: 13px; color: #8b97bd; margin: 8px 0 14px; }
        .zxzy_price_row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
        .zxzy_price { color: #fb923c; font-size: 26px; font-weight: bold; font-family: Consolas, monospace; }
        .zxzy_cut {
          font-size: 13px;
          color: #4ade80;
          background: rgba(74, 222, 128, .12);
          border-radius: 4px;
          padding: 2px 8px;
        }
        .zxzy_star { color: #fbbf24; font-size: 14px; margin-bottom: 14px; }
        .zxzy_desc { font-size: 14px; line-height: 2; color: #c3cbdf; margin-bottom: 14px; }
        .zxzy_tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .zxzy_tag {
            font-size: 12px;
            color: #7dd3fc;
            background: rgba(125, 211, 252, .12);
            border-radius: 999px;
            padding: 3px 12px;
        }
        .zxzy_table { font-size: 13.5px; line-height: 2.1; color: #c3cbdf; }
        .zxzy_table b { color: #7dd3fc; font-family: Consolas, monospace; }

        /* 骨架屏 */
        .zxzy_skel_main {
            background: #212c50;
            border: 1px solid #323f6e;
            border-radius: 16px;
            padding: 22px;
        }
        .zxzy_skel_box {
            height: 260px;
            border-radius: 12px;
            background: linear-gradient(90deg, #1a2344 25%, #222d55 50%, #1a2344 75%);
            background-size: 200% 100%;
            animation: zxzy_flash 1.2s linear infinite;
        }
        @keyframes zxzy_flash {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }
        @keyframes zxzy_in {
            from { transform: translateY(-10px); opacity: 0; }
            to   { transform: none; opacity: 1; }
        }

        /* ===== 用户评价 ===== */
        .zxzy_reviews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .zxzy_review {
            background: #212c50;
            border: 1px solid #323f6e;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13.5px;
            line-height: 1.9;
            color: #c3cbdf;
        }
        .zxzy_review .zxzy_rname { color: #7dd3fc; font-weight: bold; }
        .zxzy_review .zxzy_rstar { color: #fbbf24; }

        /* ===== 原始 JSON ===== */
        .zxzy_code {
            margin-top: 18px;
            background: #131b36;
            border: 1px solid #2c3865;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.9;
            color: #dfe4f3;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 280px;
            overflow-y: auto;
            display: none;
        }
        .zxzy_code .k { color: #7dd3fc; }
        .zxzy_code .s { color: #4ade80; }
        .zxzy_code .n { color: #fbbf24; }

        @media (max-width: 760px) {
            .zxzy_main { grid-template-columns: 1fr; }
            .zxzy_hero { padding: 20px; }
            .zxzy_h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="zxzy_wrap">

        <!-- 顶部英雄卡片 -->
        <header class="zxzy_hero">
            <div class="zxzy_hero_top">
                <span class="zxzy_badge">第17课 · JSON 与 fetch</span>
                <div class="zxzy_links">
                    <a class="zxzy_home" href="17-3.html">← 返回商品列表</a>
                    <a class="zxzy_home" href="index.html">首页</a>
                </div>
            </div>
            <h1 class="zxzy_h1">商品详情（按 ID 请求）</h1>
            <p class="zxzy_intro">
                详情页从地址栏读取商品 ID，例如
                <span class="zxzy_t zxzy_t_url">17-3-detail.html?id=1</span>，
                再拼接成接口地址
                <span class="zxzy_t zxzy_t_url">https://dummyjson.com/products/1</span>，
                用 <span class="zxzy_t zxzy_t_fn">fetch()</span> 请求后把返回的 JSON 对象渲染到页面上。
            </p>
        </header>

        <!-- 操作条 -->
        <h2 class="zxzy_h2">商品详情</h2>
        <div class="zxzy_bar">
            <button class="zxzy_btn" onclick="zxzy_go(-1)">← 上一件</button>
            <button class="zxzy_btn" onclick="zxzy_go(1)">下一件 →</button>
            <button class="zxzy_btn" onclick="zxzy_toggleJson()">显示 / 隐藏原始 JSON</button>
            <span class="zxzy_status" id="zxzy_status">准备请求…</span>
        </div>

        <section id="zxzy_main"></section>

        <h2 class="zxzy_h2">用户评价（来自接口 reviews 数组）</h2>
        <section class="zxzy_reviews" id="zxzy_reviews"></section>

        <div class="zxzy_code" id="zxzy_jsonBox"></div>

    </div>

    <script>
        // ===== 从地址栏取出 id，没有就默认 1 =====
        var zxzy_params = new URLSearchParams(location.search);
        var zxzy_id = parseInt(zxzy_params.get("id"), 10);
        if (isNaN(zxzy_id) || zxzy_id < 1) { zxzy_id = 1; }

        var zxzy_main = document.getElementById("zxzy_main");
        var zxzy_reviews = document.getElementById("zxzy_reviews");
        var zxzy_jsonBox = document.getElementById("zxzy_jsonBox");
        var zxzy_status = document.getElementById("zxzy_status");

        // ===== JSON 语法高亮 =====
        function zxzy_hl(zxzy_s) {
            return zxzy_s
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"([^"]*)"\s*:/g, '<span class="k">"$1"</span>:')
                .replace(/:\s*"([^"]*)"/g, ': <span class="s">"$1"</span>')
                .replace(/:\s*(true|false|null)/g, ': <span class="n">$1</span>')
                .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="n">$1</span>');
        }

        // ===== 画星级 =====
        function zxzy_stars(zxzy_rating) {
            var zxzy_n = Math.round(zxzy_rating);
            var zxzy_out = "";
            for (var zxzy_i = 1; zxzy_i <= 5; zxzy_i++) {
                zxzy_out += (zxzy_i <= zxzy_n ? "★" : "☆");
            }
            return zxzy_out + " " + zxzy_rating;
        }

        // ===== 点击小图切换大图 =====
        function zxzy_swap(zxzy_src) {
            document.getElementById("zxzy_bigImg").src = zxzy_src;
        }

        // ===== 骨架屏 =====
        function zxzy_skeleton() {
            zxzy_main.innerHTML =
                '<div class="zxzy_skel_main"><div class="zxzy_skel_box"></div></div>';
            zxzy_reviews.innerHTML = "";
        }

        // ===== 渲染详情 =====
        function zxzy_render(zxzy_p) {
            // 小图列表（images 数组）
            var zxzy_thumbs = "";
            zxzy_p.images.forEach(function (zxzy_src, zxzy_i) {
                zxzy_thumbs += '<img src="' + zxzy_src + '" alt="图片' + (zxzy_i + 1) +
                    '" onclick="zxzy_swap(\'' + zxzy_src + '\')">';
            });

            // 标签（tags 数组）
            var zxzy_tags = "";
            zxzy_p.tags.forEach(function (zxzy_t) {
                zxzy_tags += '<span class="zxzy_tag">' + zxzy_t + '</span>';
            });

            zxzy_main.innerHTML =
                '<div class="zxzy_main">' +
                    '<div>' +
                        '<img class="zxzy_big" id="zxzy_bigImg" src="' + zxzy_p.images[0] +
                            '" alt="' + zxzy_p.title + '">' +
                        '<div class="zxzy_thumbs">' + zxzy_thumbs + '</div>' +
                    '</div>' +
                    '<div>' +
                        '<h2 class="zxzy_title">' + zxzy_p.title + '</h2>' +
                        '<div class="zxzy_brand">品牌：' + zxzy_p.brand + '　分类：' + zxzy_p.category +
                            '　SKU：' + zxzy_p.sku + '</div>' +
                        '<div class="zxzy_price_row">' +
                            '<span class="zxzy_price">$' + zxzy_p.price + '</span>' +
                            '<span class="zxzy_cut">折扣 -' + Math.round(zxzy_p.discountPercentage) + '%</span>' +
                        '</div>' +
                        '<div class="zxzy_star">' + zxzy_stars(zxzy_p.rating) + '</div>' +
                        '<p class="zxzy_desc">' + zxzy_p.description + '</p>' +
                        '<div class="zxzy_tags">' + zxzy_tags + '</div>' +
                        '<div class="zxzy_table">' +
                            '库存：<b>' + zxzy_p.stock + '</b>　' +
                            '库存状态：<b>' + zxzy_p.availabilityStatus + '</b><br>' +
                            '重量：<b>' + zxzy_p.weight + '</b>　' +
                            '最少起订：<b>' + zxzy_p.minimumOrderQuantity + '</b><br>' +
                            '保修：<b>' + zxzy_p.warrantyInformation + '</b><br>' +
                            '物流：<b>' + zxzy_p.shippingInformation + '</b><br>' +
                            '退换政策：<b>' + zxzy_p.returnPolicy + '</b>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            // 评价列表
            zxzy_reviews.innerHTML = "";
            zxzy_p.reviews.forEach(function (zxzy_r) {
                var zxzy_div = document.createElement("div");
                zxzy_div.className = "zxzy_review";
                zxzy_div.innerHTML =
                    '<span class="zxzy_rname">' + zxzy_r.reviewerName + '</span>　' +
                    '<span class="zxzy_rstar">' + zxzy_stars(zxzy_r.rating) + '</span><br>' +
                    zxzy_r.comment + '<br>' +
                    '<span style="color:#6b78a3;font-size:12px;">' +
                        new Date(zxzy_r.date).toLocaleDateString("zh-CN") + '</span>';
                zxzy_reviews.appendChild(zxzy_div);
            });
        }

        // ===== 请求单个商品 =====
        async function zxzy_load() {
            zxzy_status.textContent = "正在请求 id = " + zxzy_id + " …";
            zxzy_skeleton();
            try {
                var zxzy_res = await fetch("https://dummyjson.com/products/" + zxzy_id);
                if (zxzy_res.ok === false) {
                    throw new Error("HTTP 状态码 " + zxzy_res.status + "（该 ID 可能不存在）");
                }
                var zxzy_p = await zxzy_res.json();
                zxzy_render(zxzy_p);
                zxzy_jsonBox.innerHTML = zxzy_hl(JSON.stringify(zxzy_p, null, 2));
                zxzy_status.textContent = "id = " + zxzy_p.id + " 请求成功";
                console.log("商品详情：", zxzy_p);
            } catch (zxzy_err) {
                zxzy_main.innerHTML =
                    '<div class="zxzy_main"><div style="color:#f87171;font-size:14px;">' +
                    '❌ 请求失败：' + zxzy_err.message + '</div></div>';
                zxzy_status.textContent = "请求失败";
                console.error(zxzy_err);
            }
        }

        // ===== 上一件 / 下一件：改地址栏 id 并重新请求 =====
        function zxzy_go(zxzy_step) {
            var zxzy_next = zxzy_id + zxzy_step;
            if (zxzy_next < 1) { return; }
            history.pushState(null, "", "?id=" + zxzy_next);   // 更新地址栏但不刷新
            zxzy_id = zxzy_next;
            zxzy_load();
        }

        // ===== 原始 JSON 显示开关 =====
        function zxzy_toggleJson() {
            zxzy_jsonBox.style.display = (zxzy_jsonBox.style.display === "block") ? "none" : "block";
        }

        // 打开页面即请求
        zxzy_load();
    </script>
</body>
</html>
