<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border:1px solid #ccc;
            font-size: 12px;
            margin:20px;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            /* 行高33px */
            line-height: 33px;
            color:#036;
        }
        #box p{
             /* 行高150% */
            line-height: 150%;
            color:#666;
            /* 首行缩进2个字符 */
            text-indent: 2em;
        }
        #box a{
            color:#f11;
            text-decoration: none;
            /* 加粗 */
            font-weight: bold;
        }
        /* 新增样式 */
        .num {
            color: blue;
            font-weight: bold;
        }
        .name {
            color: #333;
            font-weight: bold;
        }
        .hard {
            color: red;
            font-weight: bold;
        }
        .knowledge {
            color: purple;
            border: 1px solid purple;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="num">015</span>，姓名：<span class="name">周徐倬玚</span>，班级：计算机24010，对于《高级网页设计》课程的难度认知：<span class="hard">难</span>，
            这个例子对应的知识点是：<span class="knowledge">群组选择器、后代选择器、层叠与继承</span>。
            <a href="https://www.w3school.com.cn/css/index.asp" target="_blank">w3school</a>
        </p>
    </div>
</body>
</html>
