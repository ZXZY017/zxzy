<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-3 · 网帖翻译</title>
    <link rel="stylesheet" href="../font/zxzy/font_5244731_rbd6yksrikj/iconfont.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            padding: 20px 0 50px;
        }
        .zxzy_wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

        /* ===== 顶栏 ===== */
        .zxzy_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 16px;
        }
        .zxzy_title { font-size: 19px; font-weight: bold; }
        .zxzy_help {
            color: #e64d3d;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .zxzy_help .iconfont { font-size: 16px; }
        .zxzy_help:hover { text-decoration: underline; }

        /* ===== 帖子列表 ===== */
        .zxzy_item {
            display: flex;
            gap: 12px;
            padding: 18px 4px;
            border-bottom: 1px solid #f0f0f0;
        }
        .zxzy_item:hover { background: #fafbfd; }

        /* 左侧：国旗 + 金币徽章 */
        .zxzy_left {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 34px;
        }
        .zxzy_flag { font-size: 26px; line-height: 1.2; }
        .zxzy_coin {
            margin-top: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #e64d3d;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 右侧：正文与元信息 */
        .zxzy_body { flex: 1; min-width: 0; }
        .zxzy_text {
            font-size: 16px;
            line-height: 1.75;
            color: #1a1a1a;
        }
        .zxzy_meta {
            margin-top: 9px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 26px;
            font-size: 14px;
            color: #999;
        }
        .zxzy_meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .zxzy_meta .iconfont { font-size: 15px; color: #b8b8b8; }
        .zxzy_author { color: #5178c4; cursor: pointer; }
        .zxzy_author:hover { text-decoration: underline; }

        @media (max-width: 560px) {
            .zxzy_meta { gap: 16px; }
            .zxzy_text { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="zxzy_wrap">

                <span class="iconfont icon-zhuanti"></span>新手翻译说明

        <!-- 帖子列表（由 JavaScript 渲染） -->
        <main id="zxzy_list"></main>

        var zxzy_list = document.getElementById("zxzy_list");
        var zxzy_date = "2026-10-29";

        zxzy_posts.forEach(function (zxzy_p) {

            zxzy_item.innerHTML =

                    '<div class="zxzy_flag">' + zxzy_p.flag + '</div>' +

                '</div>' +
                '<div class="zxzy_body">' +

                    '<div class="zxzy_meta">' +

            zxzy_list.appendChild(zxzy_item);

        console.log("共渲染", zxzy_posts.length, "条网帖");

</body>
</html>
